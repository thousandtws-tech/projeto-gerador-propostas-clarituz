server.port=${PORT:8080}
logging.level.org.atmosphere=warn
spring.mustache.check-template-location=false

vaadin.launch-browser=true

# --- Virtual threads (Loom) ------------------------------------------------
spring.threads.virtual.enabled=true
server.tomcat.threads.max=200
spring.task.execution.thread-name-prefix=cz-task-
spring.task.scheduling.thread-name-prefix=cz-sched-

# --- Persistência ----------------------------------------------------------
# Local: H2 em arquivo | Railway: Postgres via variáveis de ambiente
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/propostas;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=32
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Pool enxuto: com virtual threads o gargalo é o banco, não as threads.
spring.datasource.hikari.maximum-pool-size=16
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.pool-name=cz-pool

# --- HTTP ------------------------------------------------------------------
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024
server.shutdown=graceful

# --- IA (LangChain4j + Google Gemini) ----------------------------------------
ia.google.api-key=${GOOGLE_API_KEY:}
ia.google.model=${IA_GOOGLE_MODEL:gemini-1.5-flash}
ia.temperature=${IA_TEMPERATURE:0.7}
ia.timeout-seconds=${IA_TIMEOUT_SECONDS:30}
